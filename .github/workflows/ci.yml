name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -B scripts/verify-calibration-followup.py
      - run: python3 -B scripts/compare-nace.py --verify eval/results/nace-2026-11-06
      - run: python3 -B scripts/analyze-nace-calibration.py --archive eval/results/nace-calibration-2026-11-06
      - run: python3 -B scripts/archive-measurement.py --verify eval/results/gemini-decision-1-archive-880-2026-11-11
      - run: python3 -B scripts/archive-measurement.py --verify eval/results/gemini-decision-1-validation-688-2026-11-11
      - run: python3 -B scripts/screen-models.py --verify eval/results/model-screen-2026-11-11
